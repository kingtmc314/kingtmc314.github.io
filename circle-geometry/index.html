const wrap=a=>(a%TAU+TAU)%TAU;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y), add=(a,b)=>({x:a.x+b.x,y:a.y+b.y}), sub=(a,b)=>({x:a.x-b.x,y:a.y-b.y}), mul=(a,k)=>({x:a.x*k,y:a.y*k}), dot=(a,b)=>a.x*b.x+a.y*b.y, cross=(a,b)=>a.x*b.y-a.y*b.x;
const mid=(a,b)=>mul(add(a,b),.5), unit=v=>{let d=Math.hypot(v.x,v.y);return d>1e-10?mul(v,1/d):{x:0,y:0}}, perp=v=>({x:-v.y,y:v.x});
const point=(O,r,a)=>({x:O.x+r*Math.cos(a),y:O.y+r*Math.sin(a)});
const ang=(a,v,b)=>{let x=sub(a,v),y=sub(b,v);if(Math.hypot(x.x,x.y)<1e-8||Math.hypot(y.x,y.y)<1e-8)return NaN;return Math.atan2(Math.abs(cross(x,y)),dot(x,y))*180/Math.PI};
const gap=(a,b)=>Math.min(wrap(a-b),wrap(b-a));

function resetPoints(){

 if(state.id==='arcs'){p.a=3.65;p.b=4.33;p.c=5.40;p.p=1.30}
 if(['cyclic','exterior','concyclic'].includes(state.id)){p.a=3.6;p.b=5.3;p.c=.6;p.d=2.1}
 if(state.id==='concyclic')p.freeD=point(state.O,state.R*.84,p.d);

 if(state.id==='twoTangents'){state.O={x:325,y:300};state.R=150;p.external={x:625,y:300}}

}
function changeTheorem(id){if(!M.some(m=>m.id===id))return;state.id=id;resetPoints();renderAll()}
function isConvex(pts){let signs=[];for(let i=0;i<4;i++){let a=pts[i],b=pts[(i+1)%4],c=pts[(i+2)%4],u=sub(b,a),w=sub(c,b),v=cross(u,w),tol=1e-12*(Math.abs(u.x*w.y)+Math.abs(u.y*w.x)+1);if(Math.abs(v)<=tol)return false;signs.push(Math.sign(v))}return signs.every(x=>x===signs[0])}
function ordered(p){let x=[p.a,p.b,p.c,p.d],g=x.map((v,i)=>wrap(x[(i+1)%4]-v));return g.every(v=>v>EPS)&&Math.abs(g.reduce((a,b)=>a+b,0)-TAU)<1e-5}
function validArcs(p){let ab=wrap(p.b-p.a),ac=wrap(p.c-p.a),ap=wrap(p.p-p.a);return ab>EPS&&ac-ab>EPS&&ac<Math.PI-EPS&&ap>ac+EPS&&ap<TAU-EPS}
function allSeparated(keys,p){for(let i=0;i<keys.length;i++)for(let j=i+1;j<keys.length;j++)if(gap(p[keys[i]],p[keys[j]])<EPS)return false;return true}
function chordOK(p){let d=gap(p.a,p.b);return d>EPS&&Math.abs(d-Math.PI)>.06}
function equalOK(p){let q={a:p.a,b:p.b,c:wrap(p.a+p.phi),d:wrap(p.b+p.phi)};return chordOK(p)&&allSeparated(['a','b','c','d'],q)}
function radiusHandleAngle(p){let taken=[p.a,p.b];if(['equalChords','equalConverse'].includes(state.id))taken.push(wrap(p.a+p.phi),wrap(p.b+p.phi));let candidates=Array.from({length:16},(_,i)=>i*TAU/16);return candidates.reduce((best,a)=>Math.min(...taken.map(x=>gap(a,x)))>Math.min(...taken.map(x=>gap(best,x)))?a:best,0)}
function pts(){let p=state.points,o=state.O,r=state.R;return {O:o,A:point(o,r,p.a),B:point(o,r,p.b),C:point(o,r,p.c),D:p.freeD||point(o,r,p.d),T:point(o,r,p.t||0),P:p.p!==undefined?point(o,r,p.p):p.external,R:point(o,r,radiusHandleAngle(p))}}
function metric(key,label,value,unitName='°',quiz=true){return{key,label,value,unit:unitName,quiz:quiz&&unitName==='°'&&Number.isFinite(value)}}
function exactText(s){
 if(state.id==='central')return t(Z('∠AOB（對應弧）= 2∠ACB','∠AOB (intercepted arc) = 2∠ACB'));
 if(state.id==='arcs')return t(Z('弧 AB / 弧 AC = ∠AOB / ∠AOC = ∠APB / ∠APC','arc AB / arc AC = ∠AOB / ∠AOC = ∠APB / ∠APC'));
 if(state.id==='concyclic')return s.valid?t(Z('∠A + ∠C = 180° ⇔ A、B、C、D 共圓','∠A + ∠C = 180° ⇔ A, B, C, D are concyclic')):t(Z('須為嚴格凸四邊形 ABCD','ABCD must be strictly convex'));
 if(state.id==='tangent')return t(Z('OT ⟂ T 點的切線','OT ⟂ tangent at T'));
 if(state.id==='sameSegment'&&!s.same)return '∠ACB + ∠ADB = 180°';
 return definition().eq;

   step(`設 h₁ = n · P = ${terms(b,a)} = ${N}，h₂ = m · Q = ${terms(d,c)} = ${M}；m × k = ${formatVec(mxk)}，k × n = ${formatVec(kxn)}。`,`Let h₁ = n · P = ${terms(b,a)} = ${N} and h₂ = m · Q = ${terms(d,c)} = ${M}; m × k = ${formatVec(mxk)} and k × n = ${formatVec(kxn)}.`);
   step(`設 X₀ = [h₁(m × k) + h₂(k × n)]/|k|²。因 n · (m × k) = |k|²、n · (k × n) = 0，而 m · (m × k) = 0、m · (k × n) = |k|²，故 n · X₀ = h₁ 且 m · X₀ = h₂；X₀ 同時位於兩平面。`,`Set X₀ = [h₁(m × k) + h₂(k × n)]/|k|². Since n · (m × k) = |k|² and n · (k × n) = 0, while m · (m × k) = 0 and m · (k × n) = |k|², we get n · X₀ = h₁ and m · X₀ = h₂. Thus X₀ lies in both planes.`);
   step(`代入得 X₀ = [${N}${formatVec(mxk)} + ${M}${formatVec(kxn)}]/${den} = ${pt.plain}。驗算：n · X₀ = ${b.map((x,i)=>`(${x})(${pt.components[i].plain})`).join(' + ')} = ${N}；m · X₀ = ${d.map((x,i)=>`(${x})(${pt.components[i].plain})`).join(' + ')} = ${M}。因此交線為 r = ${pt.plain} + t${formatVec(cross)}，t ∈ ℝ。`,`Substitution gives X₀ = [${N}${formatVec(mxk)} + ${M}${formatVec(kxn)}]/${den} = ${pt.plain}. Check: n · X₀ = ${b.map((x,i)=>`(${x})(${pt.components[i].plain})`).join(' + ')} = ${N}; m · X₀ = ${d.map((x,i)=>`(${x})(${pt.components[i].plain})`).join(' + ')} = ${M}. Hence the intersection line is r = ${pt.plain} + t${formatVec(cross)}, t ∈ ℝ.`);
  }else{
   step(`叉積為零，法向量平行；Q − P = ${formatVec(w)}，n · (Q − P) = ${terms(b,w)} = ${offset}。`,`The cross product is zero, so the normals are parallel; Q − P = ${formatVec(w)} and n · (Q − P) = ${terms(b,w)} = ${offset}.`);
   step(!offset?'此值為零，Q 在第一平面內，因此兩平面重合。':`此值非零，Q 不在第一平面內，因此兩平面平行但不重合。`,!offset?'This is zero, so Q lies in the first plane and the two planes coincide.':`This is non-zero, so Q is not in the first plane and the planes are parallel and distinct.`);
  }
 }else if(mode==='lineLine'){
  const w=C.sub(c,a),cross=C.cross(b,d),triple=C.dot(w,cross),relation=spaceRelations[result.relation]||VZ(result.relation||'—',result.relation||'—');
  metric('relation',VZ('兩直線的關係','Relation of the lines'),textVal(T(relation)));
  step(`令 r = (x, y, z)。第一條直線有點 A = ${formatVec(a)} 和非零方向 u = ${formatVec(b)}；第二條有點 B = ${formatVec(c)} 和非零方向 v = ${formatVec(d)}。t、s 均為實數參數。`,`Let r = (x, y, z). The first line has A = ${formatVec(a)} and non-zero direction u = ${formatVec(b)}; the second has B = ${formatVec(c)} and non-zero direction v = ${formatVec(d)}. The parameters t and s are real.`);
  step(`兩直線為 r = ${formatVec(a)} + t${formatVec(b)} 和 r = ${formatVec(c)} + s${formatVec(d)}。若有交點，則 tu − sv = B − A = ${formatVec(w)}。`,`The lines are r = ${formatVec(a)} + t${formatVec(b)} and r = ${formatVec(c)} + s${formatVec(d)}. At an intersection, tu − sv = B − A = ${formatVec(w)}.`);
  step(`先算 u × v = ${formatVec(b)} × ${formatVec(d)} = ${formatVec(cross)}。`,`First compute u × v = ${formatVec(b)} × ${formatVec(d)} = ${formatVec(cross)}.`);
  if(!C.norm2(cross)){
   const wu=C.cross(w,b);step(`方向平行；(B − A) × u = ${formatVec(w)} × ${formatVec(b)} = ${formatVec(wu)}。`,`The directions are parallel; (B − A) × u = ${formatVec(w)} × ${formatVec(b)} = ${formatVec(wu)}.`);
   step(C.norm2(wu)?'此叉積非零，B 不在第一條直線上，兩線平行而不重合。':'此叉積為零，B 在第一條直線上，所以兩線重合。',C.norm2(wu)?'This cross product is non-zero, so B is not on the first line and the lines are parallel and distinct.':'This cross product is zero, so B is on the first line and the lines coincide.');
  }else{
   step(`方向不平行；(B − A) · (u × v) = ${terms(w,cross)} = ${triple}。`,`The directions are not parallel; (B − A) · (u × v) = ${terms(w,cross)} = ${triple}.`);
   if(triple)step('此混合積非零，兩線不共面，因而是異面直線，沒有交點。','This scalar triple product is non-zero, so the lines are not coplanar: they are skew and have no intersection.');
   else{
    const wv=C.cross(w,d),wu=C.cross(w,b),den=C.norm2(cross),tn=C.dot(wv,cross),sn=C.dot(wu,cross),t=result.t,s=result.s,pt=result.intersection;
    metric('t',VZ('第一線參數 t','First-line parameter t'),exact(t));metric('s',VZ('第二線參數 s','Second-line parameter s'),exact(s));metric('intersection',VZ('交點','Intersection point'),exact(pt));
    step(`混合積為零，兩線共面且方向不平行，故有唯一交點。設 k = u × v = ${formatVec(cross)}，|k|² = ${squares(cross)} = ${den}。`,`The triple product is zero, so the non-parallel lines are coplanar and have a unique intersection. Let k = u × v = ${formatVec(cross)}; |k|² = ${squares(cross)} = ${den}.`);
    step(`由 tu − sv = B − A，得 (B − A) × v = ${formatVec(wv)}，(B − A) × u = ${formatVec(wu)}。因此 t = [((B − A) × v) · k]/|k|² = [${terms(wv,cross)}]/${den} = ${t.plain}；s = [((B − A) × u) · k]/|k|² = [${terms(wu,cross)}]/${den} = ${s.plain}。`,`From tu − sv = B − A, (B − A) × v = ${formatVec(wv)} and (B − A) × u = ${formatVec(wu)}. Hence t = [((B − A) × v) · k]/|k|² = [${terms(wv,cross)}]/${den} = ${t.plain}; s = [((B − A) × u) · k]/|k|² = [${terms(wu,cross)}]/${den} = ${s.plain}.`);
    step(`交點 = A + tu = ${formatVec(a)} + (${t.plain})${formatVec(b)} = ${pt.plain}；亦等於 B + sv = ${formatVec(c)} + (${s.plain})${formatVec(d)}。`,`The intersection is A + tu = ${formatVec(a)} + (${t.plain})${formatVec(b)} = ${pt.plain}; equivalently B + sv = ${formatVec(c)} + (${s.plain})${formatVec(d)}.`);
   }
  }
 }
 return scene;
}

function formulaPlain(){if(S.mode==='cross')return 'A▱ = |a × b|；A△ = ½|a × b|';if(S.mode==='relations')return T(VZ('a、b ≠ 0：a ⟂ b ⇔ a · b = 0；a ∥ b ⇔ a × b = 0','a, b ≠ 0: a ⟂ b ⇔ a · b = 0; a ∥ b ⇔ a × b = 0'));return def().eq}
function formulaTex(){if(S.mode==='relations')return '\\mathbf a,\\mathbf b\\ne\\mathbf0:\\quad\\mathbf a\\perp\\mathbf b\\iff\\mathbf a\\cdot\\mathbf b=0,\\quad\\mathbf a\\parallel\\mathbf b\\iff\\mathbf a\\times\\mathbf b=\\mathbf0';return def().tex}
function metricNode(m,hidden){let box=document.createElement('div');box.className='metric';let lab=document.createElement('div');lab.className='metric-label';lab.textContent=T(m.label);let val=document.createElement('div');val.className='metric-value'+(hidden?' hidden-value':m.value.defined===false?' vector-undefined':'');if(hidden)val.textContent='?';else if(m.value.defined===false)val.textContent=T(L.undefined);else val.append(initMath(m.value.plain,m.value.tex));box.append(lab,val);if(!hidden&&m.value.approx){let approx=document.createElement('div');approx.className='approx';approx.textContent=m.value.approx;box.append(approx)}return box}
function refreshResults(){
 if(!S.active)return;S.result=isSpace()?(window.SpaceCore&&typeof window.SpaceCore.compute==='function'?window.SpaceCore.compute(S.mode,S.a.slice(),S.b.slice(),S.c.slice(),S.d.slice()):null):null;const sc=isSpace()?makeSpaceScene(S.result):makeScene();S.metrics=sc.metrics;let hide=S.quiz&&!S.revealed,available=sc.metrics.filter(m=>m.canQuiz);
 if(hide&&isSpace()&&S.result&&S.result.valid)S.quizKey='spaceQuestion';else if(hide&&(!S.quizKey||!available.some(m=>m.key===S.quizKey)))S.quizKey=available.length?available[Math.floor(Math.random()*available.length)].key:null;
 if(isSpace()&&(!S.result||!S.result.valid))vTextMath('vEquation',T(VZ('輸入無效，不能定義所需的幾何對象','Invalid input: the required geometric object is not defined')),'\\text{undefined}');else vTextMath('vEquation',formulaPlain(),formulaTex());let metrics=D('vMetrics');metrics.replaceChildren();
 if(hide&&S.quizKey==='spaceQuestion'){let label=S.mode==='line'||S.mode==='plane'?VZ('求方程','Find the equation'):VZ('判斷關係；若相交，求交點或交線','Determine the relation; if they intersect, find the intersection');metrics.append(metricNode({key:'spaceQuestion',label,value:{defined:true}},true))}else if(hide&&S.quizKey){let picked=sc.metrics.find(x=>x.key===S.quizKey);metrics.append(metricNode(picked,true))}else sc.metrics.forEach(m=>metrics.append(metricNode(m,false)));
 let status=D('vStatus');status.hidden=!sc.status||(hide&&!(isSpace()&&(!S.result||!S.result.valid)));if(sc.status){status.className='status'+(sc.warning?' warning':'');status.textContent=T(sc.status)}
 D('vReasonText').textContent=(isSpace()&&(!S.result||!S.result.valid))?T(sc.status):hide?T(L.locked):T(def().reason);D('vSteps').replaceChildren();if(!hide)sc.steps.forEach((step,i)=>{let row=document.createElement('div');row.className='vector-step';let n=document.createElement('span');n.className='vector-step-number';n.textContent=String(i+1);let txt=document.createElement('span');txt.className='vector-step-text';txt.textContent=T(step);row.append(n,txt);D('vSteps').append(row)});
 D('vReveal').disabled=!S.quiz||S.revealed||(isSpace()&&(!S.result||!S.result.valid));TX('vReveal',S.revealed?'revealed':'reveal');renderCurrent();
}
const spaceCanvas=document.createElement('canvas');spaceCanvas.id='spaceCanvas';spaceCanvas.width=800;spaceCanvas.height=600;spaceCanvas.tabIndex=0;spaceCanvas.hidden=true;D('vectorCanvas').insertAdjacentElement('afterend',spaceCanvas);
function ensureSpaceRenderer(){if(!S.spaceRenderer&&window.SpaceRenderer&&typeof window.SpaceRenderer.create==='function')S.spaceRenderer=window.SpaceRenderer.create(spaceCanvas,{getState:()=>({mode:S.mode,a:S.a.slice(),b:S.b.slice(),c:S.c.slice(),d:S.d.slice(),lang:state.lang,aux:S.aux,quizHidden:S.quiz&&!S.revealed,result:S.result}),onChange:(key,v)=>{if(!S.active||!isSpace()||(key!=='a'&&key!=='c')||!Array.isArray(v)||v.length!==3||v.some(n=>!Number.isFinite(n)))return;S[key]=v.map(n=>Math.max(-6,Math.min(6,Math.round(n))));syncInputs();refreshResults()}});return S.spaceRenderer}
function renderCurrent(){if(!S.active)return;if(isSpace()){let renderer=ensureSpaceRenderer();if(renderer&&typeof renderer.render==='function')renderer.render()}else if(S.renderer)S.renderer.render()}
S.renderer=window.VectorRenderer.create(D('vectorCanvas'),{getState:()=>({mode:S.mode,a:S.a.slice(),b:S.b.slice(),k:S.k,m:S.m,n:S.n,aux:S.aux,quizHidden:S.quiz&&!S.revealed,lang:state.lang}),onChange:(key,v)=>{if(key!=='a'&&key!=='b')return;S[key]=v.map(n=>Math.max(-6,Math.min(6,Math.round(n))));syncInputs();refreshResults()}});
D('unitCircle').addEventListener('click',()=>unitSwitch(false));D('unitVectors').addEventListener('click',()=>unitSwitch(true));
D('vMode').addEventListener('change',e=>changeMode(e.target.value));D('vCameraReset').addEventListener('click',()=>{let renderer=isSpace()?ensureSpaceRenderer():S.renderer;if(renderer&&typeof renderer.resetView==='function')renderer.resetView();renderCurrent()});
D('vQuiz').addEventListener('change',e=>{S.quiz=e.target.checked;S.revealed=false;S.quizKey=null;refreshStatic();refreshResults()});
D('vReveal').addEventListener('click',()=>{S.revealed=true;refreshStatic();refreshResults()});D('vAux').addEventListener('change',e=>{S.aux=e.target.checked;refreshResults()});
D('language').addEventListener('change',()=>{paintSwitcher();if(S.active){refreshStatic();refreshResults()}});D('theme').addEventListener('click',()=>{if(S.active){refreshStatic();refreshResults()}});
function applyUnitHash(){if(location.hash==='#space'){S.mode='line';S.quizKey=null;S.revealed=false;unitSwitch(true,false)}else unitSwitch(location.hash==='#vectors',false)}
window.addEventListener('resize',()=>{if(S.active)renderCurrent()});window.addEventListener('hashchange',applyUnitHash);
window.VectorApp={active:()=>S.active,reset,refresh:()=>{refreshStatic();refreshResults()},switchTo:unitSwitch};
window.vectorLabTest=()=>({active:S.active,mode:S.mode,a:S.a.slice(),b:S.b.slice(),c:S.c.slice(),d:S.d.slice(),k:S.k,m:S.m,n:S.n,quiz:S.quiz,revealed:S.revealed,quizKey:S.quizKey,metrics:isSpace()&&S.quiz&&!S.revealed&&S.result&&S.result.valid?[{key:'spaceQuestion',defined:true,plain:null}]:S.metrics.map(x=>({key:x.key,defined:x.value.defined,plain:S.quiz&&!S.revealed?null:x.value.plain})),renderer:S.renderer.debug(),spaceRenderer:S.spaceRenderer&&typeof S.spaceRenderer.debug==='function'?S.spaceRenderer.debug():null});
paintSwitcher();if(location.hash==='#vectors'||location.hash==='#space')applyUnitHash();
})();
