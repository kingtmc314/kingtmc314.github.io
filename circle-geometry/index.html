const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y), add=(a,b)=>({x:a.x+b.x,y:a.y+b.y}), sub=(a,b)=>({x:a.x-b.x,y:a.y-b.y}), mul=(a,k)=>({x:a.x*k,y:a.y*k}), dot=(a,b)=>a.x*b.x+a.y*b.y, cross=(a,b)=>a.x*b.y-a.y*b.x;

function isConvex(pts){let signs=[];for(let i=0;i<4;i++){let a=pts[i],b=pts[(i+1)%4],c=pts[(i+2)%4],u=sub(b,a),w=sub(c,b),v=cross(u,w),tol=1e-12*(Math.abs(u.x*w.y)+Math.abs(u.y*w.x)+1);if(Math.abs(v)<=tol)return false;signs.push(Math.sign(v))}return signs.every(x=>x===signs[0])}
function ordered(p){let x=[p.a,p.b,p.c,p.d],g=x.map((v,i)=>wrap(x[(i+1)%4]-v));return g.every(v=>v>EPS)&&Math.abs(g.reduce((a,b)=>a+b,0)-TAU)<1e-5}
function validArcs(p){let ab=wrap(p.b-p.a),ac=wrap(p.c-p.a),ap=wrap(p.p-p.a);return ab>EPS&&ac-ab>EPS&&ac<Math.PI-EPS&&ap>ac+EPS&&ap<TAU-EPS}
function allSeparated(keys,p){for(let i=0;i<keys.length;i++)for(let j=i+1;j<keys.length;j++)if(gap(p[keys[i]],p[keys[j]])<EPS)return false;return true}
function chordOK(p){let d=gap(p.a,p.b);return d>EPS&&Math.abs(d-Math.PI)>.06}
function equalOK(p){let q={a:p.a,b:p.b,c:wrap(p.a+p.phi),d:wrap(p.b+p.phi)};return chordOK(p)&&allSeparated(['a','b','c','d'],q)}
function radiusHandleAngle(p){let taken=[p.a,p.b];if(['equalChords','equalConverse'].includes(state.id))taken.push(wrap(p.a+p.phi),wrap(p.b+p.phi));let candidates=Array.from({length:16},(_,i)=>i*TAU/16);return candidates.reduce((best,a)=>Math.min(...taken.map(x=>gap(a,x)))>Math.min(...taken.map(x=>gap(best,x)))?a:best,0)}
function pts(){let p=state.points,o=state.O,r=state.R;return {O:o,A:point(o,r,p.a),B:point(o,r,p.b),C:point(o,r,p.c),D:p.freeD||point(o,r,p.d),T:point(o,r,p.t||0),P:p.p!==undefined?point(o,r,p.p):p.external,R:point(o,r,radiusHandleAngle(p))}}

function exactText(s){
 if(state.id==='central')return t(Z('∠AOB（對應弧）= 2∠ACB','∠AOB (intercepted arc) = 2∠ACB'));
 if(state.id==='arcs')return t(Z('弧 AB / 弧 AC = ∠AOB / ∠AOC = ∠APB / ∠APC','arc AB / arc AC = ∠AOB / ∠AOC = ∠APB / ∠APC'));
 if(state.id==='concyclic')return s.valid?t(Z('∠A + ∠C = 180° ⇔ A、B、C、D 共圓','∠A + ∠C = 180° ⇔ A, B, C, D are concyclic')):t(Z('須為嚴格凸四邊形 ABCD','ABCD must be strictly convex'));
 if(state.id==='tangent')return t(Z('OT ⟂ T 點的切線','OT ⟂ tangent at T'));

function formatVec(v){return '('+v.join(', ')+')'}
function squares(v){return v.map(x=>`(${x})²`).join(' + ')}
function terms(a,b){return a.map((x,i)=>`(${x})(${b[i]})`).join(' + ')}
function makeScene(){
 const a=S.a,b=S.b,mode=S.mode,dp=C.dot(a,b),aa=C.norm2(a),bb=C.norm2(b),cross=C.cross(a,b),relation=C.classify(a,b),angle=angleVal(a,b),s={metrics:[],steps:[],status:null,warning:false};
 const metric=(key,label,value,canQuiz=true)=>s.metrics.push({key,label,value,canQuiz:canQuiz&&value.defined});
 const step=(zh,en)=>s.steps.push(VZ(zh,en));
 if(mode==='position'){
  let mag=normVal(a),u=C.unit(a);metric('position',VZ('位置向量 OA⃗','Position vector OA⃗'),vecVal(a),false);metric('magnitude',VZ('|a|','|a|'),mag);metric('unit',VZ('a 的單位向量','Unit vector of a'),u.defined?exact(u):undef());
  step(`令 a = OA⃗ = ${formatVec(a)}，它表示由 O 指向 A 的位移。`,`Let a = OA⃗ = ${formatVec(a)}; it represents the displacement from O to A.`);
  step(`|a|² = ${squares(a)} = ${aa}，因此 |a| = ${mag.plain}。`,`|a|² = ${squares(a)} = ${aa}, hence |a| = ${mag.plain}.`);
  step(u.defined?`由 â = a / |a|，單位向量為 ${pretty(u.plain)}。`:'a 是零向量，沒有可定義的單位方向。',u.defined?`Using â = a / |a|, the unit vector is ${pretty(u.plain)}.`:'a is the zero vector and has no defined unit direction.');if(!aa){s.status=L.zeroWarning;s.warning=true}
 } else if(mode==='displacement'){
  let delta=C.displacement(a,b),mag=normVal(delta);metric('delta',VZ('位移 AB⃗','Displacement AB⃗'),vecVal(delta));metric('distance',VZ('距離 AB','Distance AB'),mag);
  step(`設 A = ${formatVec(a)}、B = ${formatVec(b)}，位移是終點減起點。`,`Let A = ${formatVec(a)} and B = ${formatVec(b)}. Displacement is endpoint minus start point.`);
  step(`AB⃗ = OB⃗ − OA⃗ = ${formatVec(delta)}。`,`AB⃗ = OB⃗ − OA⃗ = ${formatVec(delta)}.`);
  step(`AB² = ${squares(delta)} = ${C.norm2(delta)}，所以 AB = ${mag.plain}。`,`AB² = ${squares(delta)} = ${C.norm2(delta)}, so AB = ${mag.plain}.`);
 } else if(mode==='addition'){
  let sum=C.add(a,b),diff=C.sub(a,b),scaled=C.scale(a,S.k);metric('sum',VZ('a + b','a + b'),vecVal(sum));metric('difference',VZ('a − b','a − b'),vecVal(diff));metric('scalar',VZ('ka','ka'),vecVal(scaled));
  step(`令 a = ${formatVec(a)}、b = ${formatVec(b)}、k = ${S.k}。`,`Let a = ${formatVec(a)}, b = ${formatVec(b)} and k = ${S.k}.`);
  step(`逐個分量相加及相減：a + b = ${formatVec(sum)}，a − b = ${formatVec(diff)}。`,`Add and subtract componentwise: a + b = ${formatVec(sum)}, a − b = ${formatVec(diff)}.`);
  step(`每一分量乘以 k = ${S.k}，得 ka = ${formatVec(scaled)}。`,`Multiply each component by k = ${S.k}, giving ka = ${formatVec(scaled)}.`);
 } else if(mode==='dot'){
  metric('dot',VZ('點積 a · b','Dot product a · b'),intVal(dp));metric('angle',VZ('夾角 θ','Included angle θ'),angle);metric('lenA',VZ('|a|','|a|'),normVal(a),false);metric('lenB',VZ('|b|','|b|'),normVal(b),false);
  step(`將對應分量相乘後相加：a · b = ${terms(a,b)} = ${dp}。`,`Multiply corresponding components and add: a · b = ${terms(a,b)} = ${dp}.`);
  step(aa&&bb?`|a| = ${normVal(a).plain}，|b| = ${normVal(b).plain}；cos θ = (a · b) / (|a||b|)。`:'至少一個向量為零，不能用長度作除數求夾角。',aa&&bb?`|a| = ${normVal(a).plain}, |b| = ${normVal(b).plain}; cos θ = (a · b) / (|a||b|).`:'At least one vector is zero, so division by the magnitudes cannot define an angle.');
  step(aa&&bb?`因此 θ = ${angle.plain}。若點積為零，兩個非零向量垂直。`:'點積仍有定義，但夾角和方向關係未定義。',aa&&bb?`Thus θ = ${angle.plain}. If the dot product is zero, the non-zero vectors are perpendicular.`:'The dot product is still defined, but the angle and direction relation are undefined.');if(!aa||!bb){s.status=L.zeroWarning;s.warning=true}
 } else if(mode==='projection'){
  let proj=C.projection(a,b);metric('dot',VZ('a · b','a · b'),intVal(dp));metric('targetNorm',VZ('b · b','b · b'),intVal(bb),false);metric('projection',VZ('a 在 b 上的向量投影','Vector projection of a onto b'),proj.defined?exact(proj.vector):undef());metric('signed',VZ('有向純量投影','Signed scalar projection'),proj.defined?scalarExact(proj.scalar):undef());
  step(`計算 a · b = ${terms(a,b)} = ${dp}；b · b = ${squares(b)} = ${bb}。`,`Compute a · b = ${terms(a,b)} = ${dp}, and b · b = ${squares(b)} = ${bb}.`);
  step(proj.defined?`投影係數 = (a · b) / (b · b) = ${pretty(proj.coefficient.plain)}。`:'b 是零向量，投影方向不存在。',proj.defined?`Projection coefficient = (a · b) / (b · b) = ${pretty(proj.coefficient.plain)}.`:'b is the zero vector, so the projection direction is undefined.');
  step(proj.defined?`將係數乘以 b，向量投影為 ${pretty(proj.vector.plain)}；有向純量投影為 ${pretty(proj.scalar.plain)}。`:'不能以零作為投影公式的分母。',proj.defined?`Multiply b by the coefficient: the vector projection is ${pretty(proj.vector.plain)}; the signed scalar projection is ${pretty(proj.scalar.plain)}.`:'The projection formula cannot have a zero denominator.');if(!proj.defined){s.status=L.zeroWarning;s.warning=true}
 } else if(mode==='cross'){
  let info=C.crossInfo(a,b);metric('cross',VZ('叉積 a × b','Cross product a × b'),vecVal(info.vector));metric('para',VZ('平行四邊形面積','Parallelogram area'),scalarExact(info.parallelogramArea));metric('tri',VZ('三角形面積','Triangle area'),scalarExact(info.triangleArea));
  step(`按順序計算 a × b = (a₂b₃ − a₃b₂, a₃b₁ − a₁b₃, a₁b₂ − a₂b₁) = ${formatVec(cross)}。`,`In order, a × b = (a₂b₃ − a₃b₂, a₃b₁ − a₁b₃, a₁b₂ − a₂b₁) = ${formatVec(cross)}.`);
  step(`|a × b|² = ${squares(cross)} = ${C.norm2(cross)}，平行四邊形面積 = ${pretty(info.parallelogramArea.plain)}。`,`|a × b|² = ${squares(cross)} = ${C.norm2(cross)}, so the parallelogram area is ${pretty(info.parallelogramArea.plain)}.`);
  step(`三角形面積是其一半，即 ${pretty(info.triangleArea.plain)}。交換 a、b 的次序會反轉叉積方向。`,`The triangle has half that area, ${pretty(info.triangleArea.plain)}. Swapping a and b reverses the cross-product direction.`);if(!C.norm2(cross)){s.status=L.zeroNormal;s.warning=true}
 } else if(mode==='division'){
  let part=C.section(a,b,S.m,S.n),delta=C.displacement(a,b);metric('division',VZ('內分點 P 的座標','Coordinates of division point P'),exact(part));metric('ratio',VZ('AP : PB','AP : PB'),{plain:`${S.m} : ${S.n}`,tex:`${S.m}:${S.n}`,defined:C.norm2(delta)!==0,approx:''},false);
  step(`令 A = ${formatVec(a)}、B = ${formatVec(b)}，且 AP : PB = ${S.m} : ${S.n}。`,`Let A = ${formatVec(a)}, B = ${formatVec(b)}, and AP : PB = ${S.m} : ${S.n}.`);
  step(`AP⃗ = ${S.m}/(${S.m}+${S.n}) AB⃗，其中 AB⃗ = ${formatVec(delta)}。`,`AP⃗ = ${S.m}/(${S.m}+${S.n}) AB⃗, where AB⃗ = ${formatVec(delta)}.`);
  step(`因此 OP⃗ = (${S.n} OA⃗ + ${S.m} OB⃗)/(${S.m}+${S.n}) = ${pretty(part.plain)}。`,`Hence OP⃗ = (${S.n} OA⃗ + ${S.m} OB⃗)/(${S.m}+${S.n}) = ${pretty(part.plain)}.`);if(!C.norm2(delta)){s.status=L.equalPoints;s.warning=true;s.metrics[1].value=undef()}
 } else if(mode==='relations'){
  let value=relation==='undefined'?undef():{plain:T(L[relation]),tex:`\\text{${relation}}`,defined:true,approx:''};metric('relation',VZ('方向關係','Direction relation'),value);metric('dot',VZ('點積 a · b','Dot product a · b'),intVal(dp));metric('cross',VZ('叉積 a × b','Cross product a × b'),vecVal(cross));metric('angle',VZ('夾角 θ','Included angle θ'),angle);
  step(`a · b = ${terms(a,b)} = ${dp}；a × b = ${formatVec(cross)}。`,`a · b = ${terms(a,b)} = ${dp}; a × b = ${formatVec(cross)}.`);
  step(aa&&bb?'兩個向量均非零：點積為零表示垂直；叉積為零表示平行。':'至少一個向量是零向量，不能依點積或叉積判定方向。',aa&&bb?'Both vectors are non-zero: a zero dot product means perpendicular and a zero cross product means parallel.':'At least one vector is zero, so dot and cross products do not determine a direction relation.');
  step(aa&&bb?`此例的方向關係為「${L[relation].zh}」。`:'此例的方向關係未定義。',aa&&bb?`In this example the direction relation is “${L[relation].en}”.`:'The direction relation is undefined in this example.');if(!aa||!bb){s.status=L.zeroWarning;s.warning=true}
 }
 return s;
}
function formulaPlain(){if(S.mode==='cross')return 'A▱ = |a × b|；A△ = ½|a × b|';if(S.mode==='relations')return T(VZ('a、b ≠ 0：a ⟂ b ⇔ a · b = 0；a ∥ b ⇔ a × b = 0','a, b ≠ 0: a ⟂ b ⇔ a · b = 0; a ∥ b ⇔ a × b = 0'));return def().eq}
function formulaTex(){if(S.mode==='relations')return '\\mathbf a,\\mathbf b\\ne\\mathbf0:\\quad\\mathbf a\\perp\\mathbf b\\iff\\mathbf a\\cdot\\mathbf b=0,\\quad\\mathbf a\\parallel\\mathbf b\\iff\\mathbf a\\times\\mathbf b=\\mathbf0';return def().tex}
function metricNode(m,hidden){let box=document.createElement('div');box.className='metric';let lab=document.createElement('div');lab.className='metric-label';lab.textContent=T(m.label);let val=document.createElement('div');val.className='metric-value'+(hidden?' hidden-value':m.value.defined===false?' vector-undefined':'');if(hidden)val.textContent='?';else if(m.value.defined===false)val.textContent=T(L.undefined);else val.append(initMath(m.value.plain,m.value.tex));box.append(lab,val);if(!hidden&&m.value.approx){let approx=document.createElement('div');approx.className='approx';approx.textContent=m.value.approx;box.append(approx)}return box}
function refreshResults(){
 if(!S.active)return;const sc=makeScene();S.metrics=sc.metrics;let hide=S.quiz&&!S.revealed,available=sc.metrics.filter(m=>m.canQuiz);
 if(hide&&(!S.quizKey||!available.some(m=>m.key===S.quizKey)))S.quizKey=available.length?available[Math.floor(Math.random()*available.length)].key:null;
 vTextMath('vEquation',formulaPlain(),formulaTex());let metrics=D('vMetrics');metrics.replaceChildren();
 if(hide&&S.quizKey){let picked=sc.metrics.find(x=>x.key===S.quizKey);metrics.append(metricNode(picked,true))}else sc.metrics.forEach(m=>metrics.append(metricNode(m,false)));
 let status=D('vStatus');status.hidden=hide||!sc.status;if(sc.status){status.className='status'+(sc.warning?' warning':'');status.textContent=T(sc.status)}
 D('vReasonText').textContent=hide?T(L.locked):T(def().reason);D('vSteps').replaceChildren();if(!hide)sc.steps.forEach((step,i)=>{let row=document.createElement('div');row.className='vector-step';let n=document.createElement('span');n.className='vector-step-number';n.textContent=String(i+1);let txt=document.createElement('span');txt.className='vector-step-text';txt.textContent=T(step);row.append(n,txt);D('vSteps').append(row)});
 D('vReveal').disabled=!S.quiz||S.revealed;TX('vReveal',S.revealed?'revealed':'reveal');S.renderer.render();
}
S.renderer=window.VectorRenderer.create(D('vectorCanvas'),{getState:()=>({mode:S.mode,a:S.a.slice(),b:S.b.slice(),k:S.k,m:S.m,n:S.n,aux:S.aux,quizHidden:S.quiz&&!S.revealed,lang:state.lang}),onChange:(key,v)=>{if(key!=='a'&&key!=='b')return;S[key]=v.map(n=>Math.max(-6,Math.min(6,Math.round(n))));syncInputs();refreshResults()}});
D('unitCircle').addEventListener('click',()=>unitSwitch(false));D('unitVectors').addEventListener('click',()=>unitSwitch(true));
D('vMode').addEventListener('change',e=>changeMode(e.target.value));D('vCameraReset').addEventListener('click',()=>{S.renderer.resetView();S.renderer.render()});
D('vQuiz').addEventListener('change',e=>{S.quiz=e.target.checked;S.revealed=false;S.quizKey=null;refreshStatic();refreshResults()});
D('vReveal').addEventListener('click',()=>{S.revealed=true;refreshStatic();refreshResults()});D('vAux').addEventListener('change',e=>{S.aux=e.target.checked;refreshResults()});
D('language').addEventListener('change',()=>{paintSwitcher();if(S.active){refreshStatic();refreshResults()}});D('theme').addEventListener('click',()=>{if(S.active){refreshStatic();refreshResults()}});
window.addEventListener('resize',()=>{if(S.active)S.renderer.render()});window.addEventListener('hashchange',()=>unitSwitch(location.hash==='#vectors',false));
window.VectorApp={active:()=>S.active,reset,refresh:()=>{refreshStatic();refreshResults()},switchTo:unitSwitch};
window.vectorLabTest=()=>({active:S.active,mode:S.mode,a:S.a.slice(),b:S.b.slice(),k:S.k,m:S.m,n:S.n,quiz:S.quiz,revealed:S.revealed,quizKey:S.quizKey,metrics:S.metrics.map(x=>({key:x.key,defined:x.value.defined,plain:S.quiz&&!S.revealed?null:x.value.plain})),renderer:S.renderer.debug()});
paintSwitcher();if(location.hash==='#vectors')unitSwitch(true,false);
})();

</script>
